name: Release

# Calcula a versão SemVer, atualiza CHANGELOG.md e cria a GitHub Release
# sempre que um commit é integrado na main com tipo que gera release.
#
# Tipos que geram release:
#   feat  → MINOR
#   fix   → PATCH
#   perf  → PATCH
#   feat! / BREAKING CHANGE → MAJOR
#
# Tipos que NÃO geram release:
#   docs, chore, test, ci, refactor (sem impacto funcional)
#
# PRÉ-REQUISITOS (configuração pelo proprietário):
#   - Settings > Actions > General > "Read and write permissions" para o GITHUB_TOKEN
#     OU criar um PAT e salvar como secret RELEASE_TOKEN
#   - Não requer semantic-release nem Node.js — implementação nativa em bash/python
#
# NOTA SOBRE @version:
#   O campo @version do userscript é atualizado manualmente com um commit
#   "chore: versão X.Y.Z". Este workflow cria a tag e a GitHub Release
#   com base nos commits desde a última tag, mas NÃO modifica o script.
#   A sincronização do @version com o SemVer automático é uma pendência futura.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Calcular versão e criar release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------
      # Identificar commits desde a última tag
      # ----------------------------------------------------------------
      - name: Obter última tag
        id: last_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "Nenhuma tag encontrada. Usando todos os commits."
            echo "tag=" >> $GITHUB_OUTPUT
            echo "ref=HEAD" >> $GITHUB_OUTPUT
          else
            echo "Última tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "ref=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Analisar commits e calcular SemVer
        id: semver
        run: |
          REF="${{ steps.last_tag.outputs.ref }}"

          if [ -z "$REF" ] || [ "$REF" = "HEAD" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" "${REF}..HEAD")
          fi

          echo "Commits analisados:"
          echo "$COMMITS"
          echo ""

          # Determinar o tipo de incremento
          BUMP="none"
          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_FIX=false

          while IFS= read -r line; do
            # BREAKING CHANGE → MAJOR
            if echo "$line" | grep -qiE "(BREAKING CHANGE|feat!|fix!|refactor!)"; then
              HAS_BREAKING=true
            fi
            # feat → MINOR
            if echo "$line" | grep -qE "^feat(\(.+\))?: "; then
              HAS_FEAT=true
            fi
            # fix, perf → PATCH
            if echo "$line" | grep -qE "^(fix|perf)(\(.+\))?: "; then
              HAS_FIX=true
            fi
          done <<< "$COMMITS"

          if [ "$HAS_BREAKING" = "true" ]; then
            BUMP="major"
          elif [ "$HAS_FEAT" = "true" ]; then
            BUMP="minor"
          elif [ "$HAS_FIX" = "true" ]; then
            BUMP="patch"
          fi

          echo "Incremento calculado: $BUMP"
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

          # Calcular a nova versão
          if [ "$BUMP" = "none" ]; then
            echo "Nenhum commit que gera release. Encerrando."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_release=true" >> $GITHUB_OUTPUT

          LAST_TAG="${{ steps.last_tag.outputs.tag }}"
          if [ -z "$LAST_TAG" ]; then
            # Primeira release: ler o @version do script como base
            SCRIPT_VERSION=$(grep -oP '(?<=@version\s{6})\d+\.\d+' paymobifin-assistente.user.js 2>/dev/null || echo "0.0")
            MAJOR=$(echo "$SCRIPT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$SCRIPT_VERSION" | cut -d. -f2)
            PATCH=0
          else
            # Remover o 'v' inicial se existir
            VERSION="${LAST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH="${PATCH:-0}"
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Nova versão: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Gerar CHANGELOG.md
      # ----------------------------------------------------------------
      - name: Gerar CHANGELOG
        if: steps.semver.outputs.should_release == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.semver.outputs.new_version }}"
          DATE=$(date +%Y-%m-%d)
          REF="${{ steps.last_tag.outputs.ref }}"

          if [ -z "$REF" ] || [ "$REF" = "HEAD" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${REF}..HEAD")
          fi

          # Separar por tipo
          BREAKING=$(echo "$COMMITS" | grep -E "BREAKING CHANGE|feat!|fix!" || true)
          FEATS=$(echo "$COMMITS" | grep -E "^- feat(\(.+\))?: " || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- (fix|perf)(\(.+\))?: " || true)
          OTHERS=$(echo "$COMMITS" | grep -vE "^- (feat|fix|perf|docs|chore|test|ci|refactor)(\(.+\))?!?: " || true)

          # Montar entrada do changelog
          ENTRY="## [$VERSION] — $DATE\n"

          if [ -n "$BREAKING" ]; then
            ENTRY="${ENTRY}\n### ⚠️ Mudanças incompatíveis\n\n${BREAKING}\n"
          fi
          if [ -n "$FEATS" ]; then
            ENTRY="${ENTRY}\n### ✨ Novas funcionalidades\n\n${FEATS}\n"
          fi
          if [ -n "$FIXES" ]; then
            ENTRY="${ENTRY}\n### 🐛 Correções\n\n${FIXES}\n"
          fi
          if [ -n "$OTHERS" ]; then
            ENTRY="${ENTRY}\n### 🔧 Outros\n\n${OTHERS}\n"
          fi

          echo "Entrada do changelog gerada."

          # Criar ou atualizar CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # Inserir a nova entrada após o cabeçalho (primeira linha)
            HEADER=$(head -1 CHANGELOG.md)
            REST=$(tail -n +2 CHANGELOG.md)
            printf "%s\n\n%b\n%s" "$HEADER" "$ENTRY" "$REST" > CHANGELOG.md
          else
            printf "# Changelog\n\n%b" "$ENTRY" > CHANGELOG.md
          fi

          echo "CHANGELOG.md atualizado."

          # Salvar o conteúdo da entrada para usar no corpo da release
          printf "%b" "$ENTRY" > /tmp/release_notes.txt
          echo "notes_file=/tmp/release_notes.txt" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # Commitar CHANGELOG.md, criar tag e criar GitHub Release
      # ----------------------------------------------------------------
      - name: Commitar CHANGELOG e criar tag
        if: steps.semver.outputs.should_release == 'true'
        run: |
          VERSION="${{ steps.semver.outputs.new_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git commit -m "chore: changelog $VERSION [skip ci]" || echo "Sem alterações no CHANGELOG."

          git tag "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

          echo "✅ Tag $VERSION criada e publicada."

      - name: Criar GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const version = '${{ steps.semver.outputs.new_version }}';
            const notesFile = '${{ steps.changelog.outputs.notes_file }}';

            let body = '';
            try {
              body = fs.readFileSync(notesFile, 'utf8');
            } catch (e) {
              body = `Release ${version}`;
            }

            body += '\n\n---\n';
            body += '**Instalação/Atualização:** o Tampermonkey atualiza automaticamente via `@updateURL` apontando para `main`.\n';

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `PaymobiFin ${version}`,
              body: body,
              draft: false,
              prerelease: false
            });

            console.log(`✅ GitHub Release ${version} criada.`);

      - name: Sem release necessária
        if: steps.semver.outputs.should_release != 'true'
        run: |
          echo "## Sem release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Nenhum commit do tipo \`feat\`, \`fix\` ou \`perf\` encontrado desde a última tag." >> $GITHUB_STEP_SUMMARY
          echo "Nenhuma release criada." >> $GITHUB_STEP_SUMMARY
