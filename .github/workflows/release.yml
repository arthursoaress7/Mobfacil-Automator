name: Release

# Depois de cada merge na main:
#   1. Lê o @version do script. Se a tag vX.Y.Z ainda não existe, cria a tag e a GitHub Release
#      com as notas da seção correspondente do CHANGELOG.md (preparado no PR de release).
#   2. Se a main tiver commits que a development não tem (ex.: o merge do PR de release),
#      abre o PR "chore: sincroniza main na development", que a validação integra sozinha.
#
# Este workflow não faz commits na main: a versão e o CHANGELOG já chegam prontos pelo
# PR de release (workflow "Preparar release").
#
# Token: usa o secret RELEASE_TOKEN (PAT) para que o PR de sincronização rode a validação
# e o merge automático. Sem ele, o PR é criado com o GITHUB_TOKEN e fica esperando merge manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Criar tag e release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: v
        run: |
          V=$(grep -oP '(?<=@version\s{6})\S+' paymobifin-assistente.user.js)
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Tag v$V já existe: nada a publicar."
            echo "nova=false" >> "$GITHUB_OUTPUT"
          else
            echo "nova=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notas da release (CHANGELOG)
        if: steps.v.outputs.nova == 'true'
        run: |
          V="${{ steps.v.outputs.versao }}"
          awk -v cab="## [v$V]" '
            index($0, cab) == 1 { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro { print }
          ' CHANGELOG.md > /tmp/notas.md
          [ -s /tmp/notas.md ] || echo "Release v$V" > /tmp/notas.md
          printf '\n---\n**Instalação/Atualização:** o Tampermonkey atualiza automaticamente via `@updateURL` apontando para `main`.\n' >> /tmp/notas.md

      - name: Criar tag e GitHub Release
        if: steps.v.outputs.nova == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.v.outputs.versao }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$V" -m "Release $V"
          git push origin "$V"
          gh release create "$V" --title "PaymobiFin $V" --notes-file /tmp/notas.md
          echo "## ✅ Release $V publicada" >> "$GITHUB_STEP_SUMMARY"

  sincronizar:
    name: Sincronizar main na development
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Abrir PR main -> development, se preciso
        run: |
          git fetch origin development
          if [ -z "$(git rev-list origin/development..origin/main)" ]; then
            echo "A development já contém a main."
            exit 0
          fi
          N=$(gh pr list --head main --base development --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            echo "PR de sincronização já aberto: #$N"
            exit 0
          fi
          gh pr create --head main --base development \
            --title "chore: sincroniza main na development" \
            --body "Gerado automaticamente depois do merge na main, para a development voltar a conter tudo o que está na main (ex.: o commit do PR de release). Integrado sozinho pela validação (merge commit)."
          echo "## PR de sincronização aberto" >> "$GITHUB_STEP_SUMMARY"
