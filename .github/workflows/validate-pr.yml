name: Validate PR

# Valida todo PR para main, development e feature/*. Em PRs rotineiros (Categoria A)
# para development ou feature/*, faz o merge automático depois que a validação passa.
#
# - PR para a main: só de development, release/proxima ou hotfix/*. Nunca tem merge automático.
# - Categoria B (workflows, scripts de CI, package.json, arquivo-ponte): a validação passa,
#   mas o merge automático não acontece — o responsável integra manualmente.
# - Rótulo "sem-auto-merge" no PR: desliga o merge automático daquele PR.
#
# Token: o merge automático usa o secret RELEASE_TOKEN (PAT). Sem ele, usa o GITHUB_TOKEN,
# mas aí o merge na development não dispara o workflow "Preparar release".

on:
  pull_request:
    branches: [main, development, 'feature/**']
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar alterações
    runs-on: ubuntu-latest
    outputs:
      categoria: ${{ steps.protected.outputs.categoria }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Arquivos alterados
      - name: Listar arquivos alterados
        id: changed
        run: |
          FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Arquivos alterados:"; echo "$FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 2. Categoria: infraestrutura = B (sem merge automático)
      - name: Classificar categoria
        id: protected
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          CATEGORIA=A
          REASON=""
          INFRA_PATTERNS=(
            ".github/workflows/"
            ".github/scripts/"
            "package.json"
            "package-lock.json"
            "automacaomobfacil.user.js"
          )
          for PATTERN in "${INFRA_PATTERNS[@]}"; do
            if echo "$FILES" | grep -qF "$PATTERN"; then
              CATEGORIA=B
              REASON="Alteração em arquivo de infraestrutura: $PATTERN"
              break
            fi
          done
          echo "categoria=$CATEGORIA" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "Categoria: $CATEGORIA $REASON"

      # 3. Título (Conventional Commits)
      - name: Verificar título do PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^(feat|fix|docs|refactor|chore|perf|test|build|ci)(\(.+\))?(!)?: .+"
          if echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "✅ Título segue Conventional Commits: $TITLE"
          else
            echo "❌ Título fora do padrão: $TITLE"
            echo "Formato esperado: tipo: descrição  (ex.: fix: corrigir leitura de propostas)"
            exit 1
          fi

      # 4. Origem dos PRs para a main
      - name: Verificar origem (PR para a main)
        if: github.event.pull_request.base.ref == 'main'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$HEAD_REF" in
            development|release/proxima|hotfix/*) echo "✅ Origem permitida para a main: $HEAD_REF" ;;
            *)
              echo "❌ PR para a main só a partir de development, release/proxima ou hotfix/*. Origem: $HEAD_REF"
              echo "Abra o PR para a development (ou feature/*); a main recebe pelo PR de release."
              exit 1 ;;
          esac

      # 5. Conflitos
      - name: Verificar conflitos
        run: |
          if [ "${{ github.event.pull_request.mergeable }}" = "false" ]; then
            echo "❌ PR tem conflitos. Resolva antes do merge."
            exit 1
          fi
          echo "✅ PR sem conflitos conhecidos."

      # 6. Integridade do script
      - name: Lint do script
        if: contains(steps.changed.outputs.files, 'paymobifin-assistente.user.js')
        run: |
          FILE="paymobifin-assistente.user.js"

          VERSION=$(grep -oP '(?<=@version\s{6})\S+' "$FILE" || true)
          if [ -z "$VERSION" ]; then echo "❌ @version não encontrado."; exit 1; fi
          echo "✅ @version: $VERSION"

          URL_OFICIAL="https://github.com/arthursoaress7/PaymobiFin-Assistente/raw/refs/heads/main/$FILE"
          URLS=$(awk '$2 ~ /^@(downloadURL|updateURL)$/ { print $2 " " $3 }' "$FILE")
          QTD_OK=$(echo "$URLS" | awk -v u="$URL_OFICIAL" '$2 == u' | wc -l)
          if [ "$QTD_OK" -ne 2 ] || [ "$(echo "$URLS" | wc -l)" -ne 2 ]; then
            echo "❌ @downloadURL ou @updateURL fora do endereço oficial (Categoria B)."
            echo "$URLS"
            exit 1
          fi
          echo "✅ @downloadURL e @updateURL no endereço oficial."

          grep -q "'use strict'" "$FILE" || { echo "❌ 'use strict' não encontrado."; exit 1; }
          grep -qP '^\(function \(\)' "$FILE" || { echo "❌ IIFE não encontrada."; exit 1; }
          echo "✅ 'use strict' e IIFE presentes."

          node --check "$FILE" || { echo "❌ Erro de sintaxe no script."; exit 1; }
          echo "✅ Sintaxe válida (node --check)."

      # 7. Versão da documentação = @version (item 12 do instructions.md)
      - name: Conferir versão na documentação
        run: |
          V=$(grep -oP '(?<=@version\s{6})\S+' paymobifin-assistente.user.js)
          ERRO=0
          conferir() { grep -qF "$2" "$1" || { echo "❌ $1 sem a versão $V (esperado: $2)"; ERRO=1; }; }
          conferir README.md "**Versão atual:** $V"
          conferir instructions.md "**Versão atual:** $V"
          conferir CLAUDE.md "| Versão atual | $V |"
          conferir docs/script/01-visao-geral.md "**Versão atual:** $V"
          conferir docs/script/03-painel-interface.md "PaymobiFin - Assistente  v$V"
          [ "$ERRO" = 0 ] && echo "✅ Documentação na versão $V."
          exit $ERRO

      - name: Resumo
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
          CATEGORIA: ${{ steps.protected.outputs.categoria }}
          REASON: ${{ steps.protected.outputs.reason }}
        run: |
          {
            echo "## Resultado da validação"
            echo ""
            echo "**PR:** $TITLE → \`$BASE\`"
            echo ""
            if [ "$BASE" = "main" ]; then
              echo "### 🔒 PR para a main: merge manual pelo responsável"
            elif [ "$CATEGORIA" = "B" ]; then
              echo "### ⛔ Categoria B — $REASON"
              echo "Validação OK, mas **sem merge automático**: aguardando o responsável."
            else
              echo "### ✅ Categoria A — merge automático"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Merge automático
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.base.ref != 'main' &&
      needs.validate.outputs.categoria == 'A' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'sem-auto-merge')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Integrar o PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          # sincronização main -> development: merge commit (mantém o histórico da main);
          # tarefas: squash (um commit por PR)
          if [ "$HEAD_REF" = "main" ]; then METODO=--merge; else METODO=--squash; fi
          if gh pr merge "$PR" --repo "$REPO" $METODO --auto 2>/tmp/erro.txt; then
            echo "✅ Merge automático ativado no PR #$PR ($METODO)."
          else
            echo "Auto-merge indisponível ($(cat /tmp/erro.txt)). Tentando merge direto..."
            gh pr merge "$PR" --repo "$REPO" $METODO
            echo "✅ PR #$PR integrado ($METODO)."
          fi
